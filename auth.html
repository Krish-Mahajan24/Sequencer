<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sign in — Sequencer</title><link rel="stylesheet" href="./css/auth.css">
</head>
<body class="auth-page">
<div class="auth-noise"></div>
<main class="auth-shell">
  <section class="auth-visual">
    
    <div class="visual-copy"><span>SEQUENCER</span><h1>Book the<br><em>vibe.</em></h1><p>Build smoother playlists. Keep every transition moving.</p></div>
  </section>
  <section class="auth-panel">
    <a class="back" href="index.html">← Back to Sequencer</a>
    <div class="auth-card">
      <div class="eyebrow">Welcome back</div><h2>Sign in</h2><p class="muted">Enter your details to continue to your library.</p>
      <div id="notice" class="notice" role="alert"></div>
      <form id="signinForm" novalidate>
        <label>Email<input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" placeholder="••••••••" required minlength="6"></label>
        <button class="main-btn" type="submit">Sign in <span>→</span></button>
      </form>
      <div class="divider"><span>or continue with</span></div>
      <div class="social-row">
        <button class="social" data-provider="google" type="button" aria-label="Continue with Google"><b>G</b><span>Google</span></button>
        <button class="social" data-provider="github" type="button" aria-label="Continue with GitHub"><b>●</b><span>GitHub</span></button>
        <button class="social" data-provider="facebook" type="button" aria-label="Continue with Facebook"><b>f</b><span>Facebook</span></button>
      </div>
      <p class="switch">Don't have an account? <a href="signup.html">Create one</a></p>
    </div>
  </section>
</main>
<script src="./js/auth.js"></script>
<script src="./js/user-store.js"></script>
</body></html>
